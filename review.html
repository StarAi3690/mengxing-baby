<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>萌星宝宝 · 评审体验通道</title>
<style>
  html,body{margin:0;height:100%}
  body{display:flex;align-items:center;justify-content:center;
       font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei",sans-serif;
       background:#f6f8f7;color:#24583c}
  .box{text-align:center;padding:24px}
  .dot{width:46px;height:46px;margin:0 auto 18px;border-radius:50%;
       border:3px solid #d8e8de;border-top-color:#3c8f5e;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .t{font-size:19px;font-weight:600;letter-spacing:.5px}
  .s{margin-top:10px;font-size:14px;color:#7d8c83;line-height:1.7}
  .s a{color:#3c8f5e;text-decoration:none;font-weight:600}
</style>
</head>
<body>
<div class="box">
  <div class="dot"></div>
  <div class="t">正在进入萌星宝宝…</div>
  <div class="s">评审体验通道 · 免卡密直接进入<br>若 3 秒内未跳转，请点 <a href="./index.html">这里</a></div>
</div>
<script>
(function () {
  'use strict';
  /* 评审直通：仅在本页写入本机体验标记，不改动主程序任何逻辑。
     主程序拦截条件为 localStorage.mengxing_device_activated === '1'，
     此处写入后跳转主程序即可直达完整功能，无需输入卡密。 */
  try {
    localStorage.setItem('mengxing_device_activated', '1');
    localStorage.setItem('mengxing_activated_code', 'MX-REVIEW-2026');
    localStorage.setItem('mengxing_activated_vip', '0');
  } catch (e) {}
  setTimeout(function () {
    location.replace('./index.html');
  }, 120);
})();
</script>
</body>
</html>
